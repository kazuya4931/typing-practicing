<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeMaster</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body data-stage="1">
  <header class="topbar">
    <div class="brand"><span class="logo">⌨</span> <span data-i18n="brand"></span> <small>TypeMaster</small></div>
    <nav class="tabs">
      <button class="tab active" data-stage="1"><b>1</b> <span data-i18n="tab1"></span></button>
      <button class="tab" data-stage="2"><b>2</b> <span data-i18n="tab2"></span></button>
      <button class="tab" data-stage="3"><b>3</b> <span data-i18n="tab3"></span></button>
    </nav>
    <div class="top-actions">
      <button class="toggle on" id="toggle-kb" data-i18n="kbToggle" data-i18n-title="kbToggleTitle"></button>
      <button class="toggle" id="toggle-heat" data-i18n="heatToggle" data-i18n-title="heatToggleTitle"></button>
      <div class="lang-switch" id="lang-switch" data-i18n-title="langTitle"><span class="globe">🌐</span></div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="ex-head">
        <div>
          <h2 id="ex-title"></h2>
          <p id="ex-desc"></p>
        </div>
        <div class="stats">
          <div class="stat"><span class="v" id="s-wpm">0</span><span class="l" data-i18n="wpm"></span></div>
          <div class="stat"><span class="v" id="s-acc">100%</span><span class="l" data-i18n="acc"></span></div>
          <div class="stat"><span class="v" id="s-time">0:00</span><span class="l" data-i18n="time"></span></div>
          <div class="stat"><span class="v" id="s-prog">0/0</span><span class="l" data-i18n="prog"></span></div>
        </div>
      </div>

      <div class="warn" id="warn"></div>

      <div class="practice">
        <div class="focus" id="focus">
          <div class="focus-key" id="focus-key">F</div>
          <div class="focus-hands" id="focus-hands"></div>
          <div class="focus-finger" id="focus-finger"></div>
        </div>
        <div class="text-wrap">
          <div class="text" id="text"></div>
          <div class="progress"><div id="progress-bar"></div></div>
        </div>
      </div>

      <div class="board" id="board">
        <div id="keyboard"></div>
        <div class="hands">
          <div class="hand-wrap" id="hand-L"></div>
          <div class="hint" id="hint"></div>
          <div class="hand-wrap" id="hand-R"></div>
        </div>
      </div>

      <div class="footer-tip" data-i18n-html="footer"></div>
    </main>
  </div>

  <div class="modal hidden" id="modal"><div class="modal-card" id="modal-card"></div></div>

  <script src="data.js?v=4"></script>
  <script src="i18n.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
